[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-mm"
version = "0.1.0"
description = "Research-grade limit-order-book laboratory for electronic market making and options hedging"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lattice" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sortedcontainers>=2.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lattice = "lattice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.hatch.build.targets.wheel.force-include]
"lattice/web" = "lattice/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
